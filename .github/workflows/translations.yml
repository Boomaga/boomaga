name: Check translation catalogs

on:
  pull_request:
    paths:
      - ".github/workflows/translations.yml"
      - "scripts/update-translations.sh"
      - "src/boomaga/**/*.c"
      - "src/boomaga/**/*.cc"
      - "src/boomaga/**/*.cpp"
      - "src/boomaga/**/*.cxx"
      - "src/boomaga/**/*.h"
      - "src/boomaga/**/*.hh"
      - "src/boomaga/**/*.hpp"
      - "src/boomaga/**/*.hxx"
      - "src/boomaga/**/*.ui"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/translations.yml"
      - "scripts/update-translations.sh"
      - "src/boomaga/**/*.c"
      - "src/boomaga/**/*.cc"
      - "src/boomaga/**/*.cpp"
      - "src/boomaga/**/*.cxx"
      - "src/boomaga/**/*.h"
      - "src/boomaga/**/*.hh"
      - "src/boomaga/**/*.hpp"
      - "src/boomaga/**/*.hxx"
      - "src/boomaga/**/*.ui"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-translations:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt translation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-tools-dev-tools

      - name: Update translation catalogs
        run: scripts/update-translations.sh /usr/lib/qt6/bin/lupdate

      - name: Check for stale translation catalogs
        run: |
          if ! git diff --exit-code -- src/boomaga/translations; then
            echo "Translation catalogs are stale." >&2
            echo "Run scripts/update-translations.sh and commit the resulting changes." >&2
            exit 1
          fi
