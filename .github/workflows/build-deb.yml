name: Build Debian package

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build for ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 26.04
            image: ubuntu:26.04
            package-suffix: ubuntu-26_04
          - distribution: Ubuntu 24.04
            image: ubuntu:24.04
            package-suffix: ubuntu-24_04
          - distribution: Debian 13
            image: debian:13
            package-suffix: debian-13
          - distribution: Debian 12
            image: debian:12
            package-suffix: debian-12
    permissions:
      contents: write

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            libcups2-dev \
            libpoppler-cpp-dev \
            libpoppler-dev \
            libsnappy-dev \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            zlib1g-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage --build=binary --no-sign
          for package in ../*.deb; do
            filename="${package##*/}"
            mv "$package" "${filename%.deb}-${{ matrix.package-suffix }}.deb"
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: boomaga-deb-packages-${{ matrix.package-suffix }}
          path: "*.deb"
          if-no-files-found: error

      - name: Upload packages to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
